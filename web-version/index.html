<!doctype html>
<html lang="en-UG">

<head>
	<title>Tic-Tac-Toe</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="game.js" defer></script>
	<script src="main.js" defer></script>
	<style>
		#board {
			display: flex;
			flex-direction: column;
			margin: 5px 5px;
			width: 720px;
			height: 720px;
		}

		.row1,
		.row2,
		.row3 {
			display: flex;
			flex-direction: row;
			color: auto;
			font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
		}

		#cell1,
		#cell2,
		#cell3,
		#cell4,
		#cell5,
		#cell6,
		#cell7,
		#cell8,
		#cell9 {
			border: solid 1px;
			border-color: black;
			border-radius: 5px;
			width: 100px;
			height: 100px;
			margin: 5px 5px;

		}
	</style>
</head>

<body>
	<div id="board">
		<h1>Welcome to Tic-Tac-Toe</h1>
		<p id="status">Loading game engine&hellip;</p>
		<div>
			<div class="row1">
				<button id="cell1">1</button>
				<button id="cell2">2</button>
				<button id="cell3">3</button>
			</div>
			<div class="row2">
				<button id="cell4">4</button>
				<button id="cell5">5</button>
				<button id="cell6">6</button>
			</div>
			<div class="row3">
				<button id="cell7">7</button>
				<button id="cell8">8</button>
				<button id="cell9">9</button>
			</div>
		</div>
		<button id="reset">New game</button>
	</div>
</body>

</html>
